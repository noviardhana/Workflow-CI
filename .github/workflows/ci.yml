name: CI/CD MLflow Docker

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas matplotlib seaborn

    - name: Run mlflow project
      run: |
        cd MLProject
        mlflow server --host 127.0.0.1 --port 5001 &
        sleep 10
        mlflow run . --env-manager=local --experiment-name="Diet_Health_Status_Basic"

    - name: Get latest MLflow run_id
      run: |
        if [ -d "MLProject/mlruns" ]; then
          RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -n 1 | cut -d'/' -f4)
        else
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
        fi
        echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # Hasil dalam bentuuk ZIP yang terdapat pada folder "Hasil_Training_Model" yang berisi model yang sudah disimpan, laporan klasifikasi awal, dan hasil evaluasi model awal.
    - name: Upload to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Hasil_Training_Model
        path: |
          MLProject/saved_model/
          MLProject/laporan_klasifikasi_awal.csv
          MLProject/hasil_evaluasi_model_awal.png

    - name: Build Docker Model
      run: |
        mlflow models build-docker --model-uri ./MLProject/saved_model --name "diet-model"

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Tag Docker Image
      run: |
        TAG=$(echo $GITHUB_SHA | cut -c1-7)
        docker tag diet-model noviardhana/diet-model:latest
        docker tag diet-model noviardhana/diet-model:$TAG

    - name: Push Docker Image
      run: |
        TAG=$(echo $GITHUB_SHA | cut -c1-7)
        docker push noviardhana/diet-model:latest
        docker push noviardhana/diet-model:$TAG