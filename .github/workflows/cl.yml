name: CI-CD MLflow Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-train-deploy:

    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.12.7"
      MODEL_PATH: "./MLProject/model_base/saved_model"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install \
            mlflow \
            scikit-learn \
            pandas \
            matplotlib \
            seaborn \
            xgboost

      - name: Verify Project Structure
        run: |
          ls -R

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . \
            --env-manager=local \
            --experiment-name Diet_Health_Status_Basic

      - name: Verify Training Outputs
        run: |
          ls -R MLProject/model_base

      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Training_Model
          path: |
            MLProject/model_base/

      - name: Build Docker Image
        run: |
          mlflow models build-docker \
            --model-uri $MODEL_PATH \
            --name diet-model

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate Image Tags
        run: |
          echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Tag Docker Images
        run: |
          docker tag diet-model noviardhana/diet-model:latest
          docker tag diet-model noviardhana/diet-model:${{ env.TAG }}

      - name: Push Docker Images
        run: |
          docker push noviardhana/diet-model:latest
          docker push noviardhana/diet-model:${{ env.TAG }}
